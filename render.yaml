services:
  - type: web
    name: swynex-queueless-canteen
    runtime: node
    plan: free
    buildCommand: npm install --prefix backend
    startCommand: npm start --prefix backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: swynex-queueless-canteen-db
          property: connectionString

databases:
  - name: swynex-queueless-canteen-db
    plan: free
    databaseName: queueless_canteen
    user: canteen_user
